<div class="carousel-item {{active}}">
  <div class="row ci-content {{reverse}}">
    <div class="col-sm-6 col-12">
      <h2 data-i18n="{{id}}.title">{{title}}</h2>
      <p data-i18n="{{id}}.description">{{description}}</p>
    </div>
    <div class="col-sm-6 col-12">
      <img class="d-block" src="{{image}}" loading="lazy" alt="{{alt}}">
    </div>
  </div>
</div>
